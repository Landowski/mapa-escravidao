{% assign apoiadores = site.data.apoiadores | sort_natural: "nome" %}
{% for a in apoiadores %}
    <div class="card-apoiador">
        <div class="card-apoiador-div">
            <span class="nome-apoiador">{{ a.nome }}</span>
            <span class="estado-apoiador">{{ a.estado }}</span>
            <a href="{{ a.carta }}" class="apoiador-carta" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 8h8"/><path d="M7 12h10"/><path d="M7 16h6"/></svg>
                Carta
            </a>
        </div>
    </div>
{% endfor %}
